<!doctype html>
<html lang="{{ lang or "de" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%230e1116'/%3E%3Cpath d='M4 5l3.5 3L4 11' fill='none' stroke='%2379c07a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M9 11h3.5' stroke='%23e8b86d' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ get_url(path="style.css") }}">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path="atom.xml") }}">
</head>
<body>
<header class="site"><div class="wrap">
  <p class="prompt"><span class="ps1">daniel@web:~$</span> <span class="cmd"><a href="{{ config.base_url }}/">kandis</a>{% block cmd %}{% endblock cmd %}</span><span class="cursor" aria-hidden="true"></span></p>
  <nav class="flags">
    <a href="{{ get_url(path="@/topics/_index.md") }}"{% if current_path is starting_with(pat="/topics") %} aria-current="page"{% endif %}>themen</a>
    <a href="{{ get_url(path="@/sources/_index.md") }}"{% if current_path is starting_with(pat="/sources") %} aria-current="page"{% endif %}>quellen</a>
    <a href="{{ get_url(path="tags") }}"{% if current_path is starting_with(pat="/tags") %} aria-current="page"{% endif %}>tags</a>
    <a href="{{ get_url(path="@/suche.md") }}"{% if current_path is starting_with(pat="/suche") %} aria-current="page"{% endif %}>suche</a>
    <a href="{{ get_url(path="atom.xml") }}">feed</a>
  </nav>
</div></header>
<main><div class="wrap">
{% block content %}{% endblock content %}
</div></main>
<footer class="site"><div class="wrap" style="display:flex;justify-content:space-between;gap:1ch;flex-wrap:wrap">
  <span>KANDIS(1)</span>
  <span>{{ config.description }}</span>
  <a href="https://altipard.github.io/">altipard</a>
</div></footer>
</body>
</html>
